<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Gestor de tareas simple, rápido y offline." />
    <meta name="theme-color" content="#7c3aed" />
    <title>Tareas</title>
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Aplica el tema antes de pintar para evitar parpadeo
      try {
        const t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <span class="blob blob-1"></span>
      <span class="blob blob-2"></span>
      <span class="blob blob-3"></span>
    </div>

    <main class="app">
      <header class="app-header">
        <div>
          <p class="eyebrow" id="today"></p>
          <h1>Mis <span class="grad">tareas</span></h1>
        </div>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Cambiar tema">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </header>

      <section class="card">
        <form id="task-form" class="task-form" autocomplete="off">
          <input id="task-input" type="text" placeholder="¿Qué hay que hacer?" maxlength="200" aria-label="Nueva tarea" required />
          <button type="submit" class="add-btn" aria-label="Agregar tarea">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span>Agregar</span>
          </button>
        </form>

        <div class="toolbar">
          <div class="filters" role="tablist" aria-label="Filtrar tareas">
            <button type="button" role="tab" data-filter="all" class="active">Todas</button>
            <button type="button" role="tab" data-filter="pending">Pendientes</button>
            <button type="button" role="tab" data-filter="done">Hechas</button>
          </div>
          <p id="counter" class="counter" aria-live="polite"></p>
        </div>

        <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>

        <ul id="task-list" class="task-list"></ul>
        <p id="empty" class="empty" hidden></p>
      </section>
    </main>

    <footer class="app-footer">
      <span>v<b id="app-version"></b></span>
      <span class="dot">•</span>
      <span>commit <code id="app-commit"></code></span>
      <span class="dot">•</span>
      <span class="env-badge" id="app-env"></span>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
